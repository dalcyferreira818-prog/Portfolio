<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cajupary - Anos 60</title>
<style>
    /* Trava a rolagem horizontal na janela principal */
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background-color: #556B2F;
    }

    .topo-audio {
        width: 100%;
        height: 70px;
        background-color: #556B2F;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0 10px;
    }

    .topo-audio audio {
        width: 100%;
        max-width: 600px;
        height: 40px;
    }

    iframe {
        width: 100%;
        height: calc(100vh - 70px);
        border: none;
        display: block;
    }
</style>
</head>
<body>

    <!-- O player de áudio fica aqui e nunca recarrega -->
    <div class="topo-audio">
        <audio controls autoplay loop src="interior.mp3"></audio>
    </div>

    <!-- O iframe carrega a primeira página inicial -->
    <iframe src="site-principal.html"></iframe>

</body>
</html>
